<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}Sistema de Delivery{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6f8;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_pedidos' %}">
                🛵 Sistema Delivery
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'listar_pedidos' %}">
                    Pedidos
                </a>

                <a class="nav-link" href="{% url 'crear_pedido' %}">
                    Nuevo pedido
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="text-center text-secondary py-4">
        Sistema de gestión de pedidos delivery
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
